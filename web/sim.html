<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Govi WhatsApp Simulator</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;550;600;650;700&family=Noto+Sans+Sinhala:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<style>
  :root { --wa: #128c7e; --wa-out: #d9fdd3; --wa-in: #ffffff; --wa-bg: #efeae2; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --wa: #00a884; --wa-out: #005c4b; --wa-in: #202c33; --wa-bg: #0b141a; } }
  body { min-height: 100vh; }
  .top { border-bottom: 1px solid var(--line); background: var(--surface); }
  .top .in { max-width: 1100px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
  .top .note { color: var(--muted); font-size: 13px; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; }
  .wrap > *, .phone > * { min-width: 0; }
  .phone { grid-template-columns: minmax(0, 1fr); }
  .people { display: grid; gap: 6px; align-content: start; }
  .people h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 10px 4px 2px; }
  .person { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-align: left; width: 100%; }
  .person.on { border-color: var(--wa); box-shadow: 0 0 0 2px color-mix(in srgb, var(--wa) 25%, transparent); }
  .av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; background: var(--wa); flex: none; }
  .av.buyer { background: var(--sky); } .av.agent { background: var(--sun); }
  .person b { display: block; font-size: 14px; }
  .person small { color: var(--muted); font-size: 12px; }
  .newnum { display: flex; gap: 6px; margin-top: 6px; }
  .newnum input { flex: 1; }
  .phone { border-radius: 22px; overflow: hidden; border: 1px solid var(--line); display: grid; grid-template-rows: auto 1fr auto; height: calc(100vh - 120px); min-height: 520px; background: var(--wa-bg); box-shadow: var(--shadow); }
  .phead { background: var(--wa); color: #fff; padding: 12px 16px; display: flex; gap: 12px; align-items: center; }
  .phead .av { background: rgba(255,255,255,.2); }
  .phead b { display: block; } .phead small { opacity: .85; }
  .phead .mode { margin-left: auto; font-size: 12px; background: rgba(255,255,255,.18); padding: 3px 9px; border-radius: 999px; }
  .msgs { overflow-y: auto; overflow-x: hidden; padding: 16px 14px; background-color: var(--wa-bg); background-image: radial-gradient(color-mix(in srgb, var(--ink) 7%, transparent) 1px, transparent 1.2px); background-size: 18px 18px; display: flex; flex-direction: column; gap: 6px; }
  .b { max-width: 78%; padding: 7px 10px 18px; border-radius: 10px; font-size: 14.5px; line-height: 1.4; white-space: pre-wrap; word-wrap: break-word; position: relative; box-shadow: 0 1px .5px rgba(0,0,0,.13); color: var(--ink); }
  .b.in { align-self: flex-end; background: var(--wa-out); border-top-right-radius: 2px; }
  .b.out { align-self: flex-start; background: var(--wa-in); border-top-left-radius: 2px; }
  .b time { position: absolute; right: 8px; bottom: 3px; font-size: 11px; color: var(--muted); }
  .b.in time::after { content: " ✓✓"; color: #53bdeb; letter-spacing: -3px; padding-right: 3px; }
  .b.out:first-line { font-weight: 600; }
  .b img { max-width: 220px; border-radius: 6px; display: block; margin-bottom: 4px; }
  .b audio { width: 220px; display: block; margin-bottom: 2px; }
  .b .tag { font-size: 12px; color: var(--muted); }
  .day { align-self: center; font-size: 12px; background: var(--surface); color: var(--muted); padding: 3px 10px; border-radius: 8px; margin: 6px 0; }
  .typing { align-self: flex-start; background: var(--wa-in); padding: 9px 14px; border-radius: 10px; color: var(--muted); font-size: 13px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 10px 0; }
  .chips button { white-space: nowrap; border: 1px solid var(--line); background: var(--surface); padding: 6px 11px; border-radius: 999px; font-size: 13px; cursor: pointer; }
  .bar { display: flex; gap: 8px; align-items: flex-end; padding: 8px 10px calc(10px + env(safe-area-inset-bottom)); }
  .bar textarea { flex: 1; resize: none; border-radius: 22px; padding: 10px 14px; max-height: 120px; border: 1px solid var(--line); background: var(--surface); min-height: 44px; }
  .ic { width: 44px; height: 44px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; font-size: 19px; background: var(--surface); flex: none; }
  .ic.send { background: var(--wa); color: #fff; }
  .ic.rec { background: var(--clay); color: #fff; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .65; } }
  .preview { padding: 6px 12px 0; font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .preview img { height: 48px; border-radius: 6px; }
  .err { color: var(--clay); }
  @media (max-width: 820px) {
    .top .in { padding: 10px 12px; gap: 8px; flex-wrap: nowrap; }
    .top .note, .logo .muted { display: none; }
    .wrap { grid-template-columns: 1fr; padding: 10px; gap: 10px; }
    .people { grid-auto-flow: column; grid-auto-columns: max-content; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    .people h2, .newnum, .person small { display: none; }
    .person { padding: 6px 12px 6px 6px; border-radius: 999px; gap: 8px; }
    .person .av { width: 30px; height: 30px; font-size: 13px; }
    .phone { height: calc(100dvh - 128px); min-height: 440px; border-radius: 16px; }
    .b { max-width: 88%; }
  }
</style>
</head>
<body>
<div class="top"><div class="in">
  <div class="logo"><span class="mark"></span>Govi Market <span class="muted" style="font-weight:500">WhatsApp simulator</span></div>
  <span class="note">Same pipeline as the real WhatsApp number: text, photos of handwritten notes and voice notes.</span>
  <span id="mode" class="badge" style="margin-left:auto">…</span>
</div></div>
<div class="wrap">
  <aside class="people" id="people"></aside>
  <section class="phone">
    <div class="phead"><span class="av" id="h-av">?</span><div><b id="h-name">Pick a person</b><small id="h-num"></small></div><span class="mode">Govi Market bot</span></div>
    <div class="msgs" id="msgs"></div>
    <div>
      <div class="chips" id="chips"></div>
      <div class="preview" id="preview" hidden></div>
      <div class="bar">
        <label class="ic" title="Send a photo">📷<input type="file" id="file" accept="image/*,audio/*" hidden></label>
        <textarea id="text" rows="1" placeholder="Type a message"></textarea>
        <button class="ic" id="mic" title="Record a voice note">🎤</button>
        <button class="ic send" id="send" title="Send">➤</button>
      </div>
    </div>
  </section>
</div>
<script src="/static/sim.js"></script>
</body>
</html>
