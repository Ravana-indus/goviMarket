<!doctype html>
<html lang="si">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e7d4f">
<title>Govi Market</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@500;700&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Sinhala:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css?v=1018b">
<link rel="stylesheet" href="/static/farmer.css?v=1018b">
</head>
<body>

<!-- 1.01 choose language, first visit only -->
<div class="welcome" id="welcome" hidden>
  <div class="in">
    <div class="photo"></div>
    <div class="body">
      <div class="brandrow"><span class="mark48"><span class="ic i-sparkles"></span></span>Govi</div>
      <div class="choose"><p class="si" lang="si">භාෂාව තෝරන්න</p><p class="ta" lang="ta">மொழியைத் தேர்வுசெய்க</p><p lang="en">Choose your language</p></div>
      <button class="langcard" data-pick="si" lang="si"><b class="si">සිංහල</b><span>Sinhala</span><i class="ic i-chev-r"></i></button>
      <button class="langcard" data-pick="ta" lang="ta"><b class="ta">தமிழ்</b><span>Tamil</span><i class="ic i-chev-r"></i></button>
      <button class="langcard" data-pick="en" lang="en"><b>English</b><i class="ic i-chev-r"></i></button>
      <p class="fine">You can change this any time from the top of the home screen.</p>
    </div>
  </div>
</div>

<div class="shell">
  <!-- 1.02 home -->
  <section class="pane home on" id="prices">
    <div class="photo"></div>
    <div class="home-in">
      <div class="head">
        <div class="logo"><span class="mk"><span class="ic i-sparkles" style="--s:18px"></span></span>Govi</div>
        <div class="r">
          <div class="acct-wrap"><button class="acct glass" id="acct" type="button"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg><span id="acct-name"></span></button>
            <div class="acct-menu" id="acct-menu" hidden><b id="am-name"></b><span class="small muted" id="am-phone"></span><span class="small" id="am-plan"></span><button class="btn" id="am-out" data-t="signout"></button></div></div>
          <div class="langs glass" id="langs" role="group" aria-label="Language"><button data-l="si" lang="si">සිං</button><button data-l="ta" lang="ta">தமி</button><button data-l="en" lang="en">EN</button></div>
        </div>
      </div>
      <div class="greet"><h1 id="greet"></h1><p id="greet-sub"></p></div>
      <div class="sellcard">
        <div class="top">
          <span class="mictile" aria-hidden="true"><span class="g1"><img alt="" src="/static/img/glass-vec1.svg"></span><span class="g2"><img alt="" src="/static/img/glass-vec2.svg"></span></span>
          <div><h2 data-t="sell_h"></h2><p data-t="sell_sub"></p></div>
        </div>
        <button class="cta primary" data-go="send" data-start="speak"><span class="ic i-mic" style="--s:20px"></span><span data-t="speak"></span></button>
        <button class="cta" data-go="send"><span data-t="other"></span></button>
      </div>
      <a class="cta" id="wa" href="#" target="_blank" rel="noopener" hidden style="margin-top:12px"><span data-t="wa"></span></a>
      <div class="sec"><h2 data-t="t_prices"></h2><span class="small" id="pdate"></span></div>
      <div class="plist" id="plist"></div>
      <p class="note" data-t="note"></p>
    </div>
  </section>

  <!-- 1.03 sell: speak, snap or type; 1.04 recording; 1.05 reading; type form; result -->
  <section class="pane" id="send">
    <div class="bar"><button class="back glass" type="button" id="back" aria-label="Back"><span class="ic i-chev-l"></span></button><h1 id="send-title" data-t="sell_h"></h1></div>

    <div id="s-start">
      <div class="voice">
        <button class="ring" id="ring" type="button" aria-label=""><span class="ic i-mic"></span></button>
        <b data-t="hold"></b><span data-t="hold_sub"></span>
      </div>
      <div class="eg"><div class="k"><span class="ic i-info"></span><span data-t="example"></span></div><q data-t="ex_text"></q></div>
      <div class="or"><span data-t="or1"></span></div>
      <div class="stack">
        <label class="cta outline" style="cursor:pointer"><span class="ic i-camera"></span><span data-t="take_photo"></span><input type="file" id="photo" accept="image/*" capture="environment" hidden></label>
        <button class="cta" id="to-type" type="button"><span class="ic i-pencil"></span><span data-t="type_it"></span></button>
        <p class="fine" data-t="understands"></p>
      </div>
      <p class="buying"><a href="/business" data-t="i_buyer"></a> →</p>
    </div>

    <div id="s-rec" class="listen" hidden>
      <h2 data-t="listening"></h2><div class="clock num" id="clock">0:00</div>
      <div class="wave" aria-hidden="true"></div>
      <button class="ring" id="ring2" type="button" aria-label=""><span class="ic i-mic"></span></button>
      <b data-t="let_go"></b><span class="small" data-t="slide_cancel"></span>
    </div>

    <div id="s-read" class="listen" hidden>
      <div class="spin" role="status"></div><h2 data-t="reading" style="font-size:20px;line-height:25px"></h2>
    </div>

    <div id="s-type" hidden>
      <div class="form" id="hform">
        <h2 data-t="h_title"></h2>
        <div class="f"><span data-t="h_crop"></span><div class="crops" id="h-crops"></div></div>
        <div class="f"><span data-t="h_kg"></span>
          <div class="qty"><button type="button" data-d="-10" aria-label="-10 kg">−</button><div class="box"><input type="number" id="h-kg" inputmode="numeric" min="1" max="20000" value="100"><span>kg</span></div><button type="button" data-d="10" aria-label="+10 kg">+</button></div>
          <div class="presets" id="presets"><button type="button">50</button><button type="button">100</button><button type="button">200</button><button type="button">500</button></div></div>
        <div class="f"><span data-t="h_ready"></span><div class="choice" id="h-ready"></div></div>
        <label class="f"><span data-t="h_town"></span><select id="h-town"></select></label>
        <div class="small muted" id="h-as" hidden></div>
        <div class="two" id="h-who">
          <label class="f"><span data-t="h_name"></span><input type="text" id="h-name" autocomplete="name"></label>
          <label class="f"><span data-t="phone_ph"></span><input type="tel" id="h-phone" inputmode="tel" autocomplete="tel" placeholder="077 123 4567"></label>
        </div>
        <button class="cta primary" id="h-go" data-t="h_post"></button>
        <div id="h-out"></div>
      </div>
      <div class="or"><span data-t="h_or"></span></div>
      <div class="form">
        <textarea id="text" rows="3"></textarea>
        <div id="picked" class="picked" hidden></div>
        <button class="cta primary" id="go" data-t="send"></button>
        <div id="reply"></div>
      </div>
    </div>

    <div id="s-out"></div>
  </section>

  <!-- 1.10 my loads -->
  <section class="pane" id="track">
    <h1 class="ttl-lg" data-t="t_loads"></h1>
    <div class="signin-ask" id="t-signin" hidden><p data-t="t_need"></p><button class="cta primary" id="tgo" data-t="signin"></button></div>
    <div class="plan" id="plan" hidden></div>
    <div class="loads" id="mine"></div>
  </section>
</div>

<nav class="tabs"><div class="in glass">
  <button data-tab="prices" class="on"><span class="ic i-house"></span><span data-t="n_home"></span></button>
  <button data-tab="send"><span class="ic i-mic"></span><span data-t="n_sell"></span></button>
  <button data-tab="track"><span class="ic i-truck"></span><span data-t="n_loads"></span></button>
</div></nav>
<script src="/static/common.js?v=1018b"></script>
<script src="/static/auth.js?v=1018b"></script>
<script src="/static/app.js?v=1018b"></script>
</body>
</html>
