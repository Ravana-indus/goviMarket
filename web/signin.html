<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7d4a">
<title>Sign in to Govi Market</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;550;600;650;700;750&family=Noto+Sans+Sinhala:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .box { width: min(400px, 100%); padding: 24px; display: grid; gap: 14px; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
  .box .btn { min-height: 50px; font-size: 16px; border-radius: 12px; }
</style>
</head>
<body>
<div class="card box">
  <div class="logo"><span class="mark"></span>Govi Market</div>
  <p class="muted" id="msg" style="margin:0">Sign in with your mobile number.</p>
  <button class="btn primary" id="go">Sign in</button>
  <button class="btn" id="out" hidden>Sign out</button>
</div>
<script src="/static/common.js"></script>
<script src="/static/auth.js"></script>
<script>
  // /signin?next=/admin : phone sign-in for any page. Without next, go to the page for your role.
  const q = new URLSearchParams(location.search);
  const raw = q.get("next") || "";
  const next = raw.startsWith("/") && !raw.startsWith("//") ? raw : "";
  const home = (u) => next || { buyer: "/business", agent: "/agent" }[u.role] || "/";
  const $ = (id) => document.getElementById(id);
  function show(u) {
    $("msg").textContent = u ? `Signed in as ${u.name || ""} (${GOVI.auth.pretty(u.phone)}).` : "Sign in with your mobile number.";
    $("go").textContent = u ? "Continue" : "Sign in"; $("out").hidden = !u;
    $("go").onclick = async () => { const v = u || await GOVI.auth.open(); if (v) location.href = home(v); };
  }
  $("out").onclick = async () => { await GOVI.auth.logout(); show(null); };
  GOVI.auth.me().then((u) => { show(u); if (!u) $("go").click(); });
</script>
</body>
</html>
